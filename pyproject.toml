[project]
name = "mcp-guard"
version = "0.1.0"
description = "Run an MCP server in isolation, record what it does, compare it with a policy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

# Installs the guard/ package into .venv so `python -m guard.client`
# works from any folder in the project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard"]
