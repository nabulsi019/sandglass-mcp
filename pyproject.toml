[project]
name = "sandglass-mcp"
version = "0.1.0"
description = "Run an MCP server in isolation, record what it does, compare it with a policy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

# `sandglass` command: same as `python -m sandglass.client`.
[project.scripts]
sandglass = "sandglass.client:main"

# Installs the sandglass/ package into .venv so `python -m sandglass.client`
# and the `sandglass` command work from any folder in the project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandglass"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
