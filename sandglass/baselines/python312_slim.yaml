# Container baseline for the sandglass-sandbox image (python:3.12-slim).
#
# Files the Python interpreter and its C libraries READ just by starting up,
# found in real traces of the notes fixtures. Loaded automatically in
# --sandbox mode and named in every report.
#
# READS ONLY: a write (or exec) under any of these paths is still a violation.
# The only exceptions are the EXACT entries in write_exact and exec_exact
# below (#142): one file each, one program with one argv, never a folder.
#
# Not a path, so not in this file (#142): a bind() to 127.0.0.1 or ::1 with
# port 0, on a socket that never listen()s or accept()s, is not a violation.
# That is urllib3 checking whether IPv6 works. See compare.py,
# _is_ipv6_probe_bind.
#
# {multiarch} is the Debian multiarch triplet, asked from Python INSIDE the
# container (aarch64-linux-gnu on Apple chips, x86_64-linux-gnu in CI).

name: python312_slim
description: Startup reads of python:3.12-slim (dynamic linker, libc, locale, OpenSSL, asyncio).

read_allow:
  - /etc/ld.so.cache               # dynamic linker's library index, read per .so load
  - /lib/{multiarch}               # shared C libraries: libc, libm, libssl, libz, ...
  - /usr/lib/{multiarch}/gconv     # glibc charset conversion modules
  - /usr/lib/locale                # glibc locale data (C.utf8)
  - /etc/localtime                 # timezone, read the first time time is used
  - /usr/lib/ssl/openssl.cnf       # OpenSSL config, read when libcrypto loads (no network)
  - /usr/lib/ssl/cert.pem          # system CA certificates (public), loaded when an HTTPS-capable client is set up
  - /proc/self/cgroup              # CPU quota detection after cryptography's Rust ext loads
  - /sys/fs/cgroup/cpu.max         # same
  - /proc/self/mountinfo           # cgroup v1 hosts: finding where the cpu controller is mounted
  - /sys/fs/cgroup/cpu/cpu.cfs_quota_us   # cgroup v1 hosts: CPU quota (v1 version of cpu.max)
  - /sys/fs/cgroup/cpu/cpu.cfs_period_us  # cgroup v1 hosts: CPU quota period (same)
  - /dev/null                      # opened read-only during asyncio/anyio startup
  - /proc/sys/vm/overcommit_memory # glibc, the first time it shrinks a thread's heap (one digit, #142)
  # The same files as above, where strace -y shows they really are (#122):
  # a read is judged by the requested AND the opened path.
  - /usr/lib/{multiarch}           # = /lib/{multiarch}: Debian's merged /usr makes /lib a link to usr/lib
  - /usr/share/zoneinfo/Etc/UTC    # = /etc/localtime, a link to the image's timezone (UTC)
  - /etc/ssl/openssl.cnf           # = /usr/lib/ssl/openssl.cnf, a link to Debian's OpenSSL config
  - /etc/ssl/certs/ca-certificates.crt  # = /usr/lib/ssl/cert.pem, a link to Debian's CA bundle

# Exact files that may be WRITTEN (#142). Nothing inside them, no other file.
write_exact:
  - /dev/null                      # opened O_RDWR to throw output away (subprocess, git, markitdown)

# Exact program runs (#142): the path AND the whole argv must match. Still
# listed under "Programs run", with `why` as the note; anything else the
# program then does is traced and judged like any other process.
exec_exact:
  - path: /usr/bin/uname
    argv: [uname, -p]
    why: "Python's platform module (platform.processor())"
